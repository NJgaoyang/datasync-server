                            <el-button type="primary" @click="previewTask" :disabled="taskSelectedTables.length===0">下一步：预览确认 <i class="fas fa-arrow-right" style="margin-left:6px"></i></el-button>
                        </div>
                    </div>

                    <div v-if="createStep===3">

                            <div class="card-title"><i class="fas fa-clipboard-list"></i> 任务概要</div>

                                <div class="info-item"><div class="info-label">任务名称</div><div class="info-value">{{ taskForm.taskName }}</div></div>
                                <div class="info-item"><div class="info-label">同步类型</div><div class="info-value" :style="{color: taskForm.syncType==='realtime'?'var(--success)':'var(--accent)'}">{{ taskForm.syncType==='realtime'?'实时同步(CDC)':'批量同步(BATCH)' }}</div></div>
                                <div class="info-item"><div class="info-label">源端</div><div class="info-value">{{ taskForm.sourceDatabase }} <span style="color:var(--text-muted);font-size:12px">({{ getDsName(taskForm.sourceId) }})</span></div></div>
                                <div class="info-item"><div class="info-label">目标</div><div class="info-value">{{ taskForm.targetDatabase }} <span style="color:var(--text-muted);font-size:12px">({{ getDsName(taskForm.targetId) }})</span></div></div>
                                <div class="info-item"><div class="info-label">目标策略</div><div class="info-value">{{ targetWriteModeText(taskForm.targetWriteMode) }}</div></div>
                            </div>
                            <div style="font-size:15px;color:var(--accent);font-weight:700;margin-top:4px">同步表数：{{ taskSelectedTables.length }} 张</div>
                        </div>

                            <div class="card-title"><i class="fas fa-file-code"></i> SeaTunnel 配置 <el-button size="mini" style="margin-left:auto" @click="copyText(previewConfig,'配置')">复制</el-button></div>

                </div>

            <!-- ═══════════ 已同步库表 ═══════════ -->
            <template v-if="currentPage==='synced-tables'">

                        <el-input v-model="syncedTableKeyword" placeholder="任务名 / 源表 / 目标表" size="default" style="flex:1 1 240px;max-width:360px" clearable></el-input>

                    </div>
                    <div class="card" v-if="filteredSyncedTables.length" style="padding:0;overflow:hidden">
                        <table class="task-table">
                            <thead><tr><th style="width:180px">所在任务</th><th style="width:90px">类型</th><th>源库表</th><th>目标库表</th><th style="width:90px">任务状态</th><th style="width:150px">配置时间</th></tr></thead>
                            <tbody><tr v-for="row in filteredSyncedTables" :key="row.id">
                                <td>
                                    <div class="task-name" style="cursor:pointer" @click="viewTaskDetail({id: row.taskId})">{{ row.taskName }}</div>

                                <td style="font-family:'JetBrains Mono',monospace;font-size:12.5px">{{ row.targetDatabase }}.<b>{{ row.targetTable }}</b></td>
                                <td><span class="status-tag" :class="execStatusClass(row.lastExecStatus)"><span class="dot"></span>{{ row.enabled ? '在线' : execStatusText(row.lastExecStatus) }}</span></td>
                                <td style="font-size:12px;color:var(--text-secondary)">{{ formatTime(row.createdAt) }}</td>
                            </tr></tbody>
                        </table>
                    </div>
                    <div class="empty-state" v-else>
                        <div class="empty-icon"><i class="fas fa-table-cells"></i></div>
                        <p>{{ syncedTableKeyword ? '没有匹配的库表' : '暂无已同步库表' }}</p>
                    </div>
                </div>
            </template>

            <!-- ═══════════ 离线任务 ═══════════ -->
            <template v-if="currentPage==='tasks-batch' || currentPage==='tasks-realtime'">

                        <div>
                            <h2>{{ currentPage==='tasks-batch' ? '离线任务' : '实时任务' }}</h2>
                            <p>{{ currentPage==='tasks-batch' ? '批量同步任务管理与执行' : 'CDC 实时同步任务管理与执行' }}</p>
                        </div>
                    </div>
                </div>
                <div class="page-body">
                    <!-- 搜索栏 -->
                    <div class="card" style="padding:16px 20px;margin-bottom:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap">
                        <span style="font-size:14px;color:var(--text-secondary);white-space:nowrap;font-weight:500">任务名</span>
                        <el-input v-model="taskSearchName" placeholder="请输入任务名" size="default" style="flex:1 1 180px;min-width:140px;max-width:280px" @keyup.enter="doSearchTasks" clearable></el-input>

                        <el-date-picker v-model="taskSearchDate" type="daterange" range-separator="~"
                            start-placeholder="开始" end-placeholder="结束" value-format="YYYY-MM-DD"
                            size="default" style="flex:1 1 220px;min-width:200px;max-width:300px">
                        </el-date-picker>
                        <span style="font-size:14px;color:var(--text-secondary);white-space:nowrap;font-weight:500">状态</span>
                        <el-select v-model="taskSearchStatus" placeholder="请选择" size="default" style="flex:0 0 130px" clearable>
                            <template v-if="currentPage==='tasks-batch' || !currentPage">
                                <el-option label="在线" value="online"></el-option>
                                <el-option label="离线" value="offline"></el-option>
                                <el-option label="定时已开启" value="scheduled"></el-option>
                            </template>
                            <template v-else>
                                <el-option label="成功" value="success"></el-option>
                                <el-option label="失败" value="failed"></el-option>
                            </template>
                        </el-select>
                        <el-button type="primary" size="default" @click="doSearchTasks">搜索</el-button>
                        <el-button size="default" @click="resetTaskSearch">重置</el-button>
                        <el-button size="default" @click="loadTasks"><i class="fas fa-sync-alt" style="margin-right:4px"></i>刷新</el-button>
                    </div>

                                <!-- 离线任务表格 -->
                    <template v-if="currentPage==='tasks-batch'">
                        <div class="card" v-if="filteredTaskList.length" style="padding:0;overflow:hidden">
                            <table class="task-table">
                                <thead><tr><th style="width:130px">名称</th><th style="width:70px">状态</th><th style="width:160px">执行概况</th><th style="width:190px">调度</th><th style="width:110px">创建时间</th><th style="width:70px">创建人</th><th style="width:140px">操作</th></tr></thead>
                                <tbody><tr v-for="task in filteredTaskList" :key="task.id">
                                    <td>
                                        <div class="task-name" style="cursor:pointer" @click="viewTaskDetail(task)">{{ task.taskName }}</div>
                                        <div style="font-size:11px;color:var(--text-muted)">ID: {{ task.id }} | {{ task.deployMode==='cluster'?'集群':'本地' }}<template v-if="task.clusterId"> · {{ getClusterName(task.clusterId) }}</template></div>
                                    </td>
                                    <td><span class="status-tag" :class="execStatusClass(task.lastExecStatus)"><span class="dot"></span>{{ execStatusText(task.lastExecStatus) }}</span></td>
                                    <td>
                                        <div style="font-size:12px;line-height:1.6">
                                            <div>耗时: {{ taskDuration(task) }}</div>
                                            <div>数据量: {{ task.lastExecRows ? formatNumber(task.lastExecRows)+'条' : '-' }}</div>
                                            <div>QPS: {{ task.lastExecQps || '-' }}</div>
                                        </div>
                                    </td>
                                    <td>
                                        <div style="font-size:11px;color:var(--text-muted);line-height:1.6">
                                            <div style="display:flex;align-items:center;gap:6px">
                                                <span>状态:</span>
                                                <span :style="{display:'inline-block',width:8,height:8,borderRadius:'50%',flexShrink:0,background:!task.cronExpression?'var(--danger)':(!task.enabled?'var(--text-muted)':'var(--success)')}"></span>
                                                <span :style="{fontSize:12,color:!task.cronExpression?'var(--danger)':(!task.enabled?'var(--text-muted)':'var(--success)'),fontWeight:500}">{{ !task.cronExpression ? '未配置' : (!task.enabled ? '已关闭' : '已开启') }}</span>
                                            </div>
                                            <div>上次: {{ task.lastExecTime ? formatTime(task.lastExecTime) : '-' }}</div>
                                            <div>下次: {{ task.enabled ? getNextRun(task) : '-' }}</div>
                                        </div>
                                    </td>
                                    <td style="font-size:12px;color:var(--text-secondary)">{{ formatTime(task.createdAt) }}</td>

                                    <td>
                                        <div style="display:flex;align-items:center;gap:4px">
                                            <template v-if="!isReadonly">

                            <label style="display:block;font-size:14px;color:var(--text-secondary);margin-bottom:4px">钉钉关键词 <span style="font-size:11px;color:var(--text-muted)">(可选，用于钉钉机器人关键词安全校验)</span></label>
                            <el-input v-model="alertForm.keyword" placeholder="告警"></el-input>
                        </div>
                        <div>
                            <label style="display:block;font-size:14px;color:var(--text-secondary);margin-bottom:4px">
                                自定义模板 <span style="font-size:11px;color:var(--text-muted)">(留空使用默认模板)</span>
                            </label>
                            <el-input v-model="alertForm.template" type="textarea" :rows="5"
                                placeholder="支持占位符: {taskName} {status} {message} {duration} {rows} {qps} {time}"></el-input>
                            <div style="font-size:11px;color:var(--text-muted);margin-top:4px;line-height:1.6">
                                可用占位符：<code>{taskName}</code> <code>{status}</code> <code>{message}</code> <code>{duration}</code> <code>{rows}</code> <code>{qps}</code> <code>{time}</code>
                                <br>钉钉支持 markdown 格式，飞书支持纯文本格式
                            </div>
                        </div>
                    </div>
                    <template #footer>
                        <el-button @click="alertDialogVisible=false">取消</el-button>
                        <el-button type="primary" @click="saveAlert">保存</el-button>
                    </template>
                </el-dialog>
            </template>
        </main>
    </div>
</div>

<script src="/lib/vue.global.prod.js"></script>
<script src="/lib/element-plus.js"></script>
<script src="/lib/axios.min.js"></script>
<script src="/lib/chart.umd.min.js"></script>
<script src="/lib/element-plus-zh-cn.js"></script>
<script>
    const { createApp, ref, reactive, computed, onMounted, watch } = Vue;
    const app = createApp({
        setup() {
            const { ElMessage, ElMessageBox } = ElementPlus;

            const api = axios.create({ baseURL: '/api', timeout: 30000 });

            const sidebarCollapsed = ref(false);
            const currentPage = ref('dashboard');
            // ===== 登录 =====
            const loggedIn = ref(false);
            const loginUser = ref('');
            const loginPass = ref('');
            const loginUserRole = ref(sessionStorage.getItem('userRole') || '');
            const isReadonly = computed(() => loginUserRole.value === 'READONLY');
            const checking = ref(!!sessionStorage.getItem('authToken'));

            function sha256(message) {
                // 纯 JS SHA-256，兼容 HTTP 非安全上下文
                function rightRotate(v, n) { return (v >>> n) | (v << (32 - n)); }
                const K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
                const msgBytes = new TextEncoder().encode(message);
                const bitLen = msgBytes.length * 8;
                const padLen = (msgBytes.length % 64 < 56) ? 56 - msgBytes.length % 64 : 120 - msgBytes.length % 64;
                const totalLen = msgBytes.length + padLen + 8;
                const padded = new Uint8Array(totalLen);
                padded.set(msgBytes);
                padded[msgBytes.length] = 0x80;
                for (let i = totalLen - 8; i < totalLen; i++) padded[i] = 0;
                const view = new DataView(padded.buffer);
                view.setUint32(totalLen - 4, bitLen);
                const H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
                for (let i = 0; i < padded.length; i += 64) {
                    const W = new Uint32Array(64);
                    for (let t = 0; t < 16; t++) W[t] = view.getUint32(i + t * 4);
                    for (let t = 16; t < 64; t++) { const s0 = rightRotate(W[t-15],7)^rightRotate(W[t-15],18)^(W[t-15]>>>3); const s1 = rightRotate(W[t-2],17)^rightRotate(W[t-2],19)^(W[t-2]>>>10); W[t]=(W[t-16]+s0+W[t-7]+s1)>>>0; }
                    let [a,b,c,d,e,f,g,h] = H;
                    for (let t = 0; t < 64; t++) { const S1 = rightRotate(e,6)^rightRotate(e,11)^rightRotate(e,25); const ch = (e&f)^(~e&g); const temp1 = (h+S1+ch+K[t]+W[t])>>>0; const S0 = rightRotate(a,2)^rightRotate(a,13)^rightRotate(a,22); const maj = (a&b)^(a&c)^(b&c); const temp2 = (S0+maj)>>>0; h=g; g=f; f=e; e=(d+temp1)>>>0; d=c; c=b; b=a; a=(temp1+temp2)>>>0; }
                    H[0]=(H[0]+a)>>>0; H[1]=(H[1]+b)>>>0; H[2]=(H[2]+c)>>>0; H[3]=(H[3]+d)>>>0; H[4]=(H[4]+e)>>>0; H[5]=(H[5]+f)>>>0; H[6]=(H[6]+g)>>>0; H[7]=(H[7]+h)>>>0;
                }
                return H.map(v => v.toString(16).padStart(8,'0')).join('');
            }

            async function doLogin() {
                if (!loginUser.value || !loginPass.value) { ElMessage.warning('请输入用户名和密码'); return; }
                try {
                    const hashed = sha256(loginPass.value);
                    const r = await api.post('/auth/login', { username: loginUser.value, password: hashed });
                    if (r.data.success) {
                        sessionStorage.setItem('authToken', r.data.token);
                        sessionStorage.setItem('userRole', r.data.user.role);
                        loginUserRole.value = r.data.user.role;
                        loggedIn.value = true;
                        loginPass.value = '';
                        currentPage.value = 'dashboard';
                        loadDs(); loadTasks(); loadDashboardStats();
                        setTimeout(() => { initChart(); loadChartData(7); }, 300);
                    } else {
                        ElMessage.error(r.data.message || '登录失败');
                    }
                } catch(e) { ElMessage.error('服务异常'); }
            }

            function collapseLogout() {
                if (sidebarCollapsed.value) doLogout();
            }

            async function doLogout() {
                try { await api.post('/auth/logout'); } catch(e) {}
                sessionStorage.removeItem('authToken');
                sessionStorage.removeItem('userRole');
                loggedIn.value = false;
            }

            // ===== 登录页鼠标眼睛跟踪 =====
            let _eyeTimer = null;
            function initEyeTracking() {
                clearInterval(_eyeTimer);
                const chars = document.querySelectorAll('.login-char-purple, .login-char-black, .login-char-yellow, .login-char-orange');
                if (!chars.length) return;
                _eyeTimer = setInterval(() => {
                    const e = window._loginMouse || { clientX: window.innerWidth / 2, clientY: window.innerHeight / 2 };
                    chars.forEach(ch => {
                        const rect = ch.getBoundingClientRect();
                        const cx = rect.left + rect.width / 2;
                        const cy = rect.top + rect.height / 2;
                        const dx = e.clientX - cx, dy = e.clientY - cy;
                        const dist = Math.sqrt(dx * dx + dy * dy) || 1;
                        const mx = (dx / dist) * 4, my = (dy / dist) * 4;
                        const curX = parseFloat(ch.style.getPropertyValue('--eye-before-x')) || 0;
                        const curY = parseFloat(ch.style.getPropertyValue('--eye-before-y')) || 0;
                        ch.style.setProperty('--eye-before-x', (curX * 0.5 + mx * 0.5) + 'px');
                        ch.style.setProperty('--eye-before-y', (curY * 0.5 + my * 0.5) + 'px');
                    });
                }, 50);
            }

            window._loginMouse = { clientX: 500, clientY: 300 };
            if (typeof window.__loginMoveSet === 'undefined') {
                window.__loginMoveSet = true;
                document.addEventListener('mousemove', function(e) {
                    window._loginMouse = { clientX: e.clientX, clientY: e.clientY };
                });
            }

            watch(loggedIn, (val) => {
                if (!val) setTimeout(initEyeTracking, 300);
                else clearInterval(_eyeTimer);
            }, { immediate: true });

            // 主题切换
            const isDark = ref(false);
            if (localStorage.getItem('theme') === 'dark') {
                isDark.value = true;
                document.body.classList.remove('light');
            } else {
                document.body.classList.add('light');
            }
            function toggleTheme() {
                isDark.value = !isDark.value;
                if (isDark.value) {
                    document.body.classList.remove('light');
                    localStorage.setItem('theme', 'dark');
                } else {
                    document.body.classList.add('light');
                    localStorage.setItem('theme', 'light');
                }
            }

            // axios 请求/响应拦截器
            api.interceptors.request.use(config => {
                const t = sessionStorage.getItem('authToken');
                if (t) config.headers['X-Auth-Token'] = t;
                return config;
            });
            api.interceptors.response.use(r => r, e => {
                if (e.response?.status === 401) {
                    sessionStorage.removeItem('authToken');
                    sessionStorage.removeItem('userRole');
                    loggedIn.value = false;
                    return Promise.reject(e);
                }
                return Promise.reject(e);
            });

            // 页面刷新恢复登录
            if (sessionStorage.getItem('authToken')) {
                api.get('/auth/check').then(r => {
                    if (r.data.success) {
                        loginUser.value = r.data.username || '';
                        loginUserRole.value = sessionStorage.getItem('userRole') || '';
                        loggedIn.value = true;
                        currentPage.value = 'dashboard';
                        loadDs(); loadTasks(); loadDashboardStats();
                        setTimeout(() => { initChart(); loadChartData(7); }, 300);
                    } else {
                        sessionStorage.removeItem('authToken');
                        sessionStorage.removeItem('userRole');
                    }
                }).catch(() => {
                    console.warn('自动登录检查失败，保留会话');
                }).finally(() => {
                    checking.value = false;
                });
            } else {
                checking.value = false;
            }

            const statusMap = { DRAFT: '草稿', GENERATED: '已就绪', RUNNING: '运行中' };
            const execStatusMap = { NONE: '未执行', PENDING: '等待中', RUNNING: '运行中', SUCCESS: '成功', FAILED: '失败' };

            function execStatusClass(status) {
                const map = { NONE: 'draft', PENDING: 'pending', RUNNING: 'running', SUCCESS: 'published', FAILED: 'failed' };
                return map[status] || 'draft';
            }
            function execStatusText(status) {
                return execStatusMap[status] || status || '未知';
            }
            function formatTime(t) {
                if (!t) return '-';
                if (Array.isArray(t)) return t.slice(0,5).join('-').replace('T',' ');
                return String(t).replace('T',' ').substring(0,19);
            }
            function calcDuration(start, end) {
                if (!start || !end) return '--';
                try {
                    const s = new Date(start).getTime(), e = new Date(end).getTime();
                    const sec = Math.round((e - s) / 1000);
                    if (sec < 60) return sec + '秒';
                    if (sec < 3600) return Math.floor(sec/60) + '分' + (sec%60) + '秒';
                    return Math.floor(sec/3600) + '时' + Math.floor((sec%3600)/60) + '分';
                } catch(e) { return '--'; }
            }

            // ===== 仪表盘 =====
            const todayStats = ref({ total: 0, success: 0, failed: 0 });
            const chartHasData = ref(false);
            const activeRange = ref('7d');
            const dashTab = ref('all');
            const emptyDashStats = () => ({ total: 0, success: 0, failed: 0, running: 0, pending: 0, none: 0 });
            const dashboardStats = ref({ all: emptyDashStats(), batch: emptyDashStats(), realtime: emptyDashStats() });
            const dashStats = computed(() => dashboardStats.value[dashTab.value] || emptyDashStats());
            const dashFilteredTasks = computed(() => {
                if (dashTab.value === 'all') return taskList.value;
                return taskList.value.filter(t => t.syncType === dashTab.value);
            });
            let execChart = null;

            async function loadDashboardStats() {
                try {
                    const r = await api.get('/task/stats/dashboard');
                    dashboardStats.value = {
                        all: { ...emptyDashStats(), ...(r.data.all || {}) },
                        batch: { ...emptyDashStats(), ...(r.data.batch || {}) },
                        realtime: { ...emptyDashStats(), ...(r.data.realtime || {}) }
                    };
                } catch(e) { console.error(e); }
            }

            function getDateRange(days) {
                const end = new Date();
                const start = new Date();
                start.setDate(start.getDate() - days + 1);
                return [start.toISOString().split('T')[0], end.toISOString().split('T')[0]];
            }

            function switchRange(range) {
                activeRange.value = range;
                const days = range === '7d' ? 7 : (range === '15d' ? 15 : 30);
                loadChartData(days);
            }

            async function loadChartData(days) {
                days = days || 7;
                const [start, end] = getDateRange(days);
                try {
                    const r = await api.get('/task/stats/executions', { params: { startDate: start, endDate: end } });
                    const data = r.data;
                    todayStats.value = data.today || { total: 0, success: 0, failed: 0 };

                    const chartData = data.chartData || [];
                    chartHasData.value = chartData.length > 0;

                    const labels = chartData.map(d => d.date);
                    const successData = chartData.map(d => d.success || 0);
                    const failedData = chartData.map(d => d.failed || 0);

                    updateChart(labels, successData, failedData);
                } catch(e) { console.error(e); }
            }

            function initChart() {
                const ctx = document.getElementById('execChart');
                if (!ctx) return;
                if (execChart) { execChart.destroy(); execChart = null; }
                execChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: [],
                        datasets: [
                            {
                                label: '成功',
                                data: [],
                                borderColor: '#10b981',
                                backgroundColor: 'rgba(16,185,129,0.08)',
                                fill: true,
                                tension: 0.35,
                                pointRadius: 3,
                                pointHoverRadius: 6,
                                pointBackgroundColor: '#10b981',
                                borderWidth: 2
                            },
                            {
                                label: '失败',
                                data: [],
                                borderColor: '#ef4444',
                                backgroundColor: 'rgba(239,68,68,0.06)',
                                fill: true,
                                tension: 0.35,
                                pointRadius: 3,
                                pointHoverRadius: 6,
                                pointBackgroundColor: '#ef4444',
                                borderWidth: 2
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        interaction: { mode: 'index', intersect: false },
                        plugins: {
                            legend: {
                                labels: { color: '#8892b0', usePointStyle: true, padding: 20, font: { size: 14 } }
                            },
                            tooltip: {
                                backgroundColor: '#121830',
                                titleColor: '#eef1f8',
                                bodyColor: '#96a0bd',
                                borderColor: '#1e2a4a',
                                borderWidth: 1,
                                padding: 14,
                                cornerRadius: 8,
                                titleFont: { size: 14 },
                                bodyFont: { size: 13 }
                            }
                        },
                        scales: {
                            x: {
                                grid: { color: 'rgba(30,42,74,0.4)' },
                                ticks: { color: '#5a6680', font: { size: 13 }, maxTicksLimit: 14 }
                            },
                            y: {
                                grid: { color: 'rgba(30,42,74,0.4)' },
                                ticks: { color: '#5a6680', font: { size: 13 }, stepSize: 1, beginAtZero: true }
                            }
                        }
                    }
                });
            }

            function updateChart(labels, successData, failedData) {
                if (!execChart) {
                    initChart();
                    if (!execChart) return;
                }
                execChart.data.labels = labels;
                execChart.data.datasets[0].data = successData;
                execChart.data.datasets[1].data = failedData;
                execChart.update();
            }

            function destroyChart() {
                if (execChart) { execChart.destroy(); execChart = null; }
            }

            watch(currentPage, (newPage) => {
                if (newPage === 'dashboard') {
                    setTimeout(() => { initChart(); loadChartData(7); loadDashboardStats(); }, 100);
                } else {
                    destroyChart();
                }
            });

            // ===== 数据源管理 =====
            const dsList = ref([]);
            const dsFilter = ref('all');
            const dsDialogVisible = ref(false);
            const dsForm = ref({ id: null, name: '', type: 'mysql', host: '', port: 3306, username: '', password: '', databaseName: '', description: '' });
            const filteredDs = computed(() => dsList.value.filter(d => dsFilter.value === 'all' || d.type === dsFilter.value));
            const mysqlDsList = computed(() => dsList.value.filter(d => d.type === 'mysql'));
            const srDsList = computed(() => dsList.value.filter(d => d.type === 'starrocks'));

            async function loadDs() { try { const r = await api.get('/datasource/list'); dsList.value = r.data; } catch(e) { console.error(e); } }
            function openDsDialog(ds) { dsForm.value = ds ? { ...ds } : { id: null, name: '', type: 'mysql', host: '', port: 3306, username: '', password: '', databaseName: '', description: '' }; dsDialogVisible.value = true; }
            async function saveDs() { try { if (dsForm.value.id) await api.put('/datasource/update', dsForm.value); else await api.post('/datasource/save', dsForm.value); ElMessage.success('保存成功'); dsDialogVisible.value = false; await loadDs(); } catch(e) { console.error(e); } }
            async function deleteDs(ds) { try { await ElMessageBox.confirm('确认删除该数据源？', '确认', { type: 'warning' }); await api.delete('/datasource/' + ds.id); ElMessage.success('删除成功'); await loadDs(); } catch(e) { if (e !== 'cancel') console.error(e); } }
            async function testDs(ds) { try { const r = await api.post('/datasource/test', ds); if (r.data === true || r.data === 'true' || (r.data && r.data.success === true)) ElMessage.success('连接成功'); else ElMessage.error('连接失败'); } catch(e) { console.error(e); } }
            function getDsName(id) { const ds = dsList.value.find(d => d.id === id); return ds ? ds.name : '-'; }
            function copyText(text, label) {
                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(text).then(() => {
                        ElMessage.success((label || '内容') + '已复制到剪贴板');
                    }).catch(() => {});
                } else {
                    // HTTP 环境 fallback
                    const ta = document.createElement('textarea');
                    ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px';
                    document.body.appendChild(ta); ta.select();
                    try { document.execCommand('copy'); ElMessage.success((label || '内容') + '已复制到剪贴板'); } catch(e) {}
                    document.body.removeChild(ta);
                }
            }

            // ===== 元数据浏览 =====
            const metaDsId = ref(null), metaDatabase = ref(''), metaDatabases = ref([]), metaTables = ref([]);
            const metaSelectedTable = ref(''), metaColumns = ref([]);
            const metaPreviewColumns = ref([]), metaPreviewRows = ref([]);
            const metaRefreshing = ref(false), metaRefreshTime = ref('');

            const metaDsType = computed(() => {
                const ds = dsList.value.find(d => d.id === metaDsId.value);
                return ds ? ds.type : '';
            });

            // DDL 查看
            const metaDdlVisible = ref(false), metaDdlContent = ref('');
            async function viewMetaDdl() {
                try {
                    if (metaDsType.value === 'mysql') {
                        // MySQL 数据源：前端根据列信息构造 MySQL DDL
                        metaDdlContent.value = buildMysqlDdl();
                    } else {
                        const r = await api.post('/metadata/generate-ddl', {
                            sourceId: metaDsId.value, sourceDatabase: metaDatabase.value,
                            sourceTable: metaSelectedTable.value,
                            targetDatabase: metaDatabase.value, targetTable: metaSelectedTable.value
                        });
                        metaDdlContent.value = r.data.ddl;
                    }
                    metaDdlVisible.value = true;
                } catch(e) { metaDdlContent.value = 'DDL生成失败'; metaDdlVisible.value = true; }
            }

            function buildMysqlDdl() {
                const cols = metaColumns.value;
                if (!cols.length) return '无列信息';
                let ddl = 'CREATE TABLE `' + metaSelectedTable.value + '` (\n';
                const pkCols = [];
                cols.forEach((c, i) => {
                    ddl += '  `' + c.columnName + '` ' + c.columnType;
                    if (c.columnKey === 'PRI') ddl += ' NOT NULL';
                    if (c.columnComment) ddl += " COMMENT '" + c.columnComment + "'";
                    if (i < cols.length - 1) ddl += ',';
                    ddl += '\n';
                    if (c.columnKey === 'PRI') pkCols.push(c.columnName);
                });
                if (pkCols.length) {
                    ddl += ', PRIMARY KEY (' + pkCols.map(c => '`' + c + '`').join(', ') + ')\n';
                }
                ddl += ') ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;';
                return ddl;
            }

            async function genStarRocksDdl() {
                try {
                    const r = await api.post('/metadata/generate-ddl', {
                        sourceId: metaDsId.value, sourceDatabase: metaDatabase.value,
                        sourceTable: metaSelectedTable.value,
                        targetDatabase: metaDatabase.value, targetTable: metaSelectedTable.value
                    });
                    metaDdlContent.value = r.data.ddl;
                    metaDdlVisible.value = true;
                } catch(e) { metaDdlContent.value = 'DDL生成失败'; metaDdlVisible.value = true; }
            }

            // SQL 执行
            const sqlDialogVisible = ref(false), sqlText = ref(''), sqlExecuting = ref(false), sqlResult = ref(null);
            function openSqlDialog() {
                if (!metaDatabase.value) { ElMessage.warning('请先选择数据库'); return; }
                sqlText.value = ''; sqlResult.value = null; sqlDialogVisible.value = true;
            }
            async function executeMetaSql() {
                if (!sqlText.value.trim()) { ElMessage.warning('请输入 SQL 语句'); return; }
                try {
                    await ElMessageBox.confirm('确认执行该 SQL？此操作不可撤销。', '二次确认', { type: 'warning', confirmButtonText: '确认执行', cancelButtonText: '取消' });
                } catch(e) { return; }
                sqlExecuting.value = true;
                try {
                    const r = await api.post('/metadata/execute-sql', { datasourceId: metaDsId.value, database: metaDatabase.value, sql: sqlText.value });
                    sqlResult.value = r.data;
                } catch(e) { console.error(e); } finally { sqlExecuting.value = false; }
            }

            // 行数据 CRUD（仅 StarRocks）
            const editRowVisible = ref(false), editRowMode = ref('add'), editRowValues = ref({}), editRowSubmitting = ref(false);
            const editRowPkVal = ref(null);
            const metaTableData = ref({ columns: [], rows: [] });

            function getPkColumn() {
                const pk = metaColumns.value.find(c => c.columnKey === 'PRI');
                return pk ? pk.columnName : (metaColumns.value.length > 0 ? metaColumns.value[0].columnName : 'id');
            }

            function openAddRowDialog() {
                editRowMode.value = 'add';

                    if (p.includes('-')) { const [a,b] = p.split('-').map(Number); if (isNaN(a) || isNaN(b) || a > b) return []; const r = []; for (let i = a; i <= b; i++) r.push(i); return r; }

                    }
                    const dow = d.getDay() === 0 ? 7 : d.getDay();
                    const maxDay = new Date(y, mo, 0).getDate();
                    const dy = d.getDate();
                    const dOk = !isDay || days.includes(dy);
                    const wOk = !isWeek || weeks.includes(dow);
                    if (!dOk || !wOk || dy > maxDay) { d.setDate(dy + 1); d.setHours(0, 0, 0, 0); continue; }
                    const hr = d.getHours();
                    if (!hrs.includes(hr)) {
                        const nx = hrs.find(h => h > hr);
                        if (nx !== undefined) d.setHours(nx, 0, 0, 0);
                        else { d.setDate(d.getDate() + 1); d.setHours(hrs[0], 0, 0, 0); }
                        continue;
                    }
                    const min = d.getMinutes();
                    if (!mins.includes(min)) {
                        const nx = mins.find(m => m > min);
                        if (nx !== undefined) d.setMinutes(nx, 0, 0);
                        else { d.setHours(hr + 1, mins[0], 0, 0); }
                        continue;
                    }
                    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0') + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0') + ':' + String(d.getSeconds()).padStart(2,'0');

            const cron = reactive({

            function fieldVal(arr) {
                return (Array.isArray(arr) && arr.length) ? [...arr].sort((a,b)=>a-b).join(',') : '*';
            }

            function debouncedBuild() {
                if (_parsing) return;

            function buildCron() {
                // 仅选择了分钟时，按"每隔N分钟"处理（仅单值，且 > 0 避免 */0）
                const onlyMinute = cron.minute.spec.length === 1 && cron.minute.spec[0] > 0 && !cron.hour.spec.length && !cron.day.spec.length && !cron.month.spec.length && !cron.week.spec.length;
                let m = onlyMinute ? '*/' + cron.minute.spec[0] : fieldVal(cron.minute.spec);
                // 仅选择了小时时，按"每隔N小时"处理（仅单值，且 > 0 避免 */0）
                const onlyHour = cron.hour.spec.length === 1 && cron.hour.spec[0] > 0 && !cron.minute.spec.length && !cron.day.spec.length && !cron.month.spec.length && !cron.week.spec.length;
                let h = onlyHour ? '*/' + cron.hour.spec[0] : fieldVal(cron.hour.spec);
                const d = fieldVal(cron.day.spec);
                const mon = fieldVal(cron.month.spec);
                const w = fieldVal(cron.week.spec);
                // 日和周互斥
                let dayPart = d, weekPart = '?';
                if (cron.week.spec.length) { weekPart = w; dayPart = '?'; }
                if (cron.day.spec.length) { weekPart = '?'; }
                cronExpression.value = '0 ' + m + ' ' + h + ' ' + dayPart + ' ' + mon + ' ' + weekPart;
                parseCronNext(['0', m, h, dayPart, mon, weekPart], 5);
            }

            function _expandCronField(p, max) {
                // 将 cron 字段展开为排序后的匹配值数组
                if (p === '*' || p === '?') {
                    const r = []; for (let i = 0; i <= max; i++) r.push(i); return r;
                }
                if (p.startsWith('*/')) {
                    const step = parseInt(p.substring(2)); if (step <= 0) return []; const r = [];
                    for (let i = 0; i <= max; i += step) r.push(i);
                    return r;
                }
                if (p.includes(',')) {
                    return p.split(',').map(Number).filter(n => !isNaN(n)).sort((a,b)=>a-b);
                }
                if (p.includes('-')) {
                    const [a,b] = p.split('-').map(Number); if (isNaN(a) || isNaN(b) || a > b) return []; const r = [];
                    for (let i = a; i <= b; i++) r.push(i);
                    return r;
                }
                const n = parseInt(p);
                return isNaN(n) ? [] : [n];
            }

            function parseCronNext(parts, count) {
                // 智能跳跃算法：展开每个字段后逐级匹配，不匹配时跳到下一个有效值
                if (!parts || parts.length < 6) { cronNextRuns.value = []; return; }
                const minutesSet = _expandCronField(parts[1], 59);
                const hoursSet   = _expandCronField(parts[2], 23);
                const monsSet    = _expandCronField(parts[4], 12);
                const isDayField = parts[3] !== '?';
                const isWeekField = parts[5] !== '?';
                const daysSet    = isDayField ? _expandCronField(parts[3], 31) : [];
                const weeksSet   = isWeekField ? _expandCronField(parts[5], 7) : [];

                if (!minutesSet.length || !hoursSet.length || !monsSet.length) { cronNextRuns.value = []; return; }

                const results = [];
                let d = new Date();
                d.setMilliseconds(0);
                d.setSeconds(0);
                d.setMinutes(d.getMinutes() + 1); // 从下一分钟开始
                let safe = 366 * 24 * 5; // 安全上限（最多迭代5年/天）

                const fmt = (dt) => dt.toLocaleString('zh-CN', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false });

                while (results.length < count && safe-- > 0) {
                    const y = d.getFullYear();
                    const mo = d.getMonth() + 1;

                    // 1. 月不匹配 → 跳到下一个匹配月份
                    if (!monsSet.includes(mo)) {
                        const nx = monsSet.find(m => m > mo);
                        if (nx !== undefined) d.setMonth(nx - 1, 1);
                        else { d.setFullYear(y + 1, monsSet[0] - 1, 1); }
                        d.setHours(0, 0, 0, 0);
                        continue;
                    }

                    // 2. 日/周匹配检查
                    const dow = d.getDay() === 0 ? 7 : d.getDay();
                    const maxDay = new Date(y, mo, 0).getDate();
                    const dy = d.getDate();
                    const dayOk = !isDayField || daysSet.includes(dy);
                    const weekOk = !isWeekField || weeksSet.includes(dow);

                    if (!dayOk || !weekOk || dy > maxDay) {
                        d.setDate(dy + 1);
                        d.setHours(0, 0, 0, 0);
                        continue;
                    }

                    // 3. 时不匹配 → 跳到下一个匹配小时
                    const hr = d.getHours();
                    if (!hoursSet.includes(hr)) {
                        const nx = hoursSet.find(h => h > hr);
                        if (nx !== undefined) d.setHours(nx, 0, 0, 0);
                        else { d.setDate(d.getDate() + 1); d.setHours(hoursSet[0], 0, 0, 0); }
                        continue;
                    }

                    // 4. 分钟不匹配 → 跳到下一个匹配分钟
                    const min = d.getMinutes();
                    if (!minutesSet.includes(min)) {
                        const nx = minutesSet.find(m => m > min);
                        if (nx !== undefined) d.setMinutes(nx, 0, 0);
                        else { d.setHours(hr + 1, minutesSet[0], 0, 0); }
                        continue;
                    }

                    // 5. 完全匹配 → 记录结果，前进到下一个有效分钟
                    results.push(fmt(d));
                    const nx = minutesSet.find(m => m > min);
                    if (nx !== undefined) d.setMinutes(nx, 0, 0);
                    else { d.setHours(hr + 1, minutesSet[0], 0, 0); }
                }
                cronNextRuns.value = results;
            }

            function parseCronToVisual(expr) {
                _parsing = true;
                ['minute','hour','day','month','week'].forEach(k => cron[k].spec = []);
                if (!expr || !expr.trim()) { buildCron(); _parsing = false; return; }
                const parts = expr.trim().split(/\s+/);
                const offset = parts.length >= 6 ? 1 : 0;
                const fields = ['minute','hour','day','month','week'];
                const maxVals = { minute: 59, hour: 23, day: 31, month: 12, week: 7 };
                fields.forEach((key, i) => {
                    const idx = offset + i;
                    if (idx >= parts.length) return;
                    const v = parts[idx];
                    if (v === '*' || v === '?') return;
                    let arr = [];
                    if (v.startsWith('*/')) {
                        const step = parseInt(v.substring(2));
                        if (step <= 0) { arr = []; } else {
                            const max = maxVals[key];
                            for (let x = (key === 'day' || key === 'month' || key === 'week' ? 1 : 0); x <= max; x += step) arr.push(x);
                        }
                    }
                    else if (v.includes(',')) arr = v.split(',').map(Number).filter(n => !isNaN(n));
                    else if (v.includes('-')) { const [a,b] = v.split('-').map(Number); if (!isNaN(a) && !isNaN(b) && a <= b) for (let x = a; x <= b; x++) arr.push(x); }
                    else if (/^\d+$/.test(v)) arr = [parseInt(v)];
                    cron[key].spec = arr;
                });
                buildCron();
                _parsing = false;
            }

                try {
                    await api.post('/cluster/save', clusterForm.value);
                    ElMessage.success(clusterForm.value.id ? '更新成功' : '新增成功');
                    clusterDialogVisible.value = false;
                    await loadClusterList();
                } catch(e) { console.error(e); }
            }

            function getClusterName(id) {
                if (!id) return '-';
                const c = clusterList.value.find(x => x.id === id);
                return c ? c.clientName + ' (' + c.host + ':' + c.port + ')' : 'ID:' + id;
            }

            function viewClusterDetail(client) {
                clusterDetail.value = client;
                clusterDetailVisible.value = true;
            }

            async function checkClusterHealth(client) {
                const ci = clusterList.value.find(c => c.id === client.id);
                if (!ci) return;
                ci._checking = true;
                try {
                    const r = await api.post('/cluster/' + client.id + '/health');
                    ci.status = r.data.status;
                    ci.cpuUsage = r.data.cpuUsage;
                    ci.memoryUsage = r.data.memoryUsage;
                    if (r.data.status === 'ONLINE') {
                        ElMessage.success(ci.clientName + ' - ' + (r.data.message || '连接正常'));
                    } else {
                        ElMessage.warning(ci.clientName + ' - ' + (r.data.message || '无法连接'));
                    }
                } catch(e) {
                    ci.status = 'OFFLINE';
                    ElMessage.error('检查失败: ' + (e.response?.data?.message || e.message));
                } finally { ci._checking = false; }
            }

            async function checkAllHealth() {
                checkingAllHealth.value = true;
                try {
                    await api.post('/cluster/health-check-all');
                    await loadClusterList();
                    ElMessage.success('全部检查完成');
                } catch(e) { console.error(e); } finally { checkingAllHealth.value = false; }
            }

            async function deleteCluster(client) {
                try {
                    await ElMessageBox.confirm('确定删除客户端「' + client.clientName + '」？', '删除确认', { confirmButtonText: '删除', cancelButtonText: '取消', type: 'warning' });
                    await api.delete('/cluster/' + client.id);
                    ElMessage.success('已删除');
                    await loadClusterList();
                } catch(e) { if (e !== 'cancel') console.error(e); }
            }

            // ===== 用户管理 =====
            const userList = ref([]);
            const userDialogVisible = ref(false);
            const userForm = ref({ id: null, username: '', password: '', realName: '', role: 'USER', enabled: true });

            async function loadUserList() {
                try { const r = await api.get('/user/list'); userList.value = r.data; } catch(e) { console.error(e); }
            }
            function openUserDialog(user) {
                if (user) { userForm.value = { ...user, password: '' }; }
                else { userForm.value = { id: null, username: '', password: '', realName: '', role: 'USER', enabled: true }; }
                userDialogVisible.value = true;
            }
            async function saveUser() {
                try {
                    const payload = { ...userForm.value };
                    if (payload.password) {
                        payload.password = sha256(payload.password);
                    }
                    if (userForm.value.id) await api.put('/user/update', payload);
                    else await api.post('/user/save', payload);
                    ElMessage.success('保存成功'); userDialogVisible.value = false; await loadUserList();
                } catch(e) { console.error(e); }
            }
            async function deleteUser(user) {
                try {
                    await ElMessageBox.confirm('确认删除用户【' + user.username + '】？', '删除确认', { type: 'warning' });
                    await api.delete('/user/' + user.id);
                    ElMessage.success('已删除'); await loadUserList();
                } catch(e) { if (e !== 'cancel') console.error(e); }
            }

            // ===== 权限管理 =====
            const permUserId = ref(null), permDsId = ref(null), permCanSql = ref(false), permList = ref([]);
            const permDsMap = computed(() => {
                const m = {}; dsList.value.forEach(d => { m[d.id] = d.name; }); return m;
            });
            async function loadUserPermissions() {
                if (!permUserId.value) { permList.value = []; return; }
                try { const r = await api.get('/user/' + permUserId.value + '/permissions'); permList.value = r.data; } catch(e) { console.error(e); }
            }
            async function grantPermission() {
                if (!permUserId.value || !permDsId.value) { ElMessage.warning('请选择用户和数据源'); return; }
                try {
                    await api.post('/user/grant', { userId: permUserId.value, datasourceId: permDsId.value, canExecuteSql: permCanSql.value });
                    ElMessage.success('授权成功'); permDsId.value = null; permCanSql.value = false; await loadUserPermissions();
                } catch(e) { console.error(e); }
            }
            async function revokePermission(datasourceId) {
                try {
                    await ElMessageBox.confirm('确认撤销该权限？', '确认', { type: 'warning' });
                    await api.post('/user/revoke', { userId: permUserId.value, datasourceId: datasourceId });
                    ElMessage.success('已撤销'); await loadUserPermissions();
                } catch(e) { if (e !== 'cancel') console.error(e); }
            }

            // ===== 操作记录 =====
            const opLogKeyword = ref('');
            const opLogDateRange = ref(null);
            const opLogList = ref([]);
            const opLogTotal = ref(0);
            const opLogPage = ref(1);
            const opLogPageSize = ref(15);
            const opLogTotalPages = ref(0);

            async function loadOpLogPage(pg) {
                if (pg !== undefined) opLogPage.value = pg;
                try {
                    const params = { keyword: opLogKeyword.value, page: opLogPage.value - 1, size: opLogPageSize.value };
                    if (loginUserRole.value !== 'ADMIN') params.username = loginUser.value;
                    if (opLogDateRange.value && opLogDateRange.value.length === 2) {
                        params.startDate = opLogDateRange.value[0];
                        params.endDate = opLogDateRange.value[1];
                    }
                    const r = await api.get('/log/page', { params });
                    opLogList.value = r.data.content || [];
                    opLogTotal.value = r.data.totalElements || 0;
                    opLogTotalPages.value = r.data.totalPages || 0;
                } catch(e) { console.error(e); }
            }

            // ===== 告警配置 =====
            const alertList = ref([]);
            const alertDialogVisible = ref(false);
            const alertForm = ref({ id: null, name: '', type: 'DINGTALK', webhookUrl: '', secret: '', keyword: '', template: '', enabled: true, eventTypes: 'FAILURE' });

            async function loadAlertList() {
                try { const r = await api.get('/alert/list'); alertList.value = r.data; } catch(e) { console.error(e); }
            }
            function openAlertDialog(a) {
                if (a) { alertForm.value = { ...a }; }
                else { alertForm.value = { id: null, name: '', type: 'DINGTALK', webhookUrl: '', secret: '', keyword: '', template: '', enabled: true, eventTypes: 'FAILURE' }; }
                alertDialogVisible.value = true;
            }
            async function saveAlert() {
                if (!alertForm.value.name || !alertForm.value.webhookUrl) { ElMessage.warning('请填写名称和Webhook地址'); return; }
                try {
                    if (alertForm.value.id) await api.put('/alert/update', alertForm.value);
                    else await api.post('/alert/save', alertForm.value);
                    ElMessage.success('保存成功'); alertDialogVisible.value = false; await loadAlertList();
                } catch(e) { ElMessage.error(e.response?.data?.message || '保存失败'); }
            }
            async function toggleAlert(a) {
                try { await api.post('/alert/toggle/' + a.id); } catch(e) { a.enabled = !a.enabled; ElMessage.error('操作失败'); }
            }
            async function deleteAlert(a) {
                try {
                    await ElMessageBox.confirm('确认删除告警配置「' + a.name + '」？', '删除确认', { type: 'warning' });
                    await api.delete('/alert/' + a.id);
                    ElMessage.success('已删除'); await loadAlertList();
                } catch(e) { if (e !== 'cancel') console.error(e); }
            }
            async function testAlert(a) {
                try {
                    const r = await api.post('/alert/test/' + a.id);
                    if (r.data && r.data.success === false) {
                        ElMessage.error('发送失败: ' + (r.data.message || '未知错误'));
                    } else {
                        ElMessage.success('测试消息已发送，请检查 ' + (a.type==='DINGTALK'?'钉钉':'飞书') + ' 群聊');
                    }
                } catch(e) { ElMessage.error(e.response?.data?.message || e.response?.data?.error || '测试发送失败'); }
            }

            onMounted(() => {
                const loader = document.getElementById('page-loader');
                if (loader) loader.style.display = 'none';
            });

            return {
                isDark, toggleTheme,
                sidebarCollapsed,
                loggedIn, loginUser, loginPass, loginUserRole, isReadonly, checking, doLogin, doLogout, collapseLogout,
                currentPage, statusMap, copyText,
                execStatusClass, execStatusText, formatTime, calcDuration,
                todayStats, activeRange, chartHasData, switchRange,
                dashTab, dashFilteredTasks, dashboardStats, dashStats,
                dsList, dsFilter, dsDialogVisible, dsForm, filteredDs, mysqlDsList, srDsList,
                openDsDialog, saveDs, deleteDs, testDs, getDsName,
                metaDsId, metaDsType, metaDatabase, metaDatabases, metaTables, metaSelectedTable, metaColumns, metaPreviewColumns, metaPreviewRows,
                metaRefreshing, metaRefreshTime, onMetaDsChange, onMetaDbChange, refreshMetadata, selectMetaTable,
                metaDdlVisible, metaDdlContent, viewMetaDdl, genStarRocksDdl, confirmDropTable,
                sqlDialogVisible, sqlText, sqlExecuting, sqlResult, openSqlDialog, executeMetaSql,
                editRowVisible, editRowMode, editRowValues, editRowSubmitting,
                openAddRowDialog, openEditRowDialog, submitEditRow, confirmDeleteRow, copyCell,
                createStep, taskForm, taskDatabases, taskTargetDatabases, taskTableList, taskSelectedTables, taskSelectAll, taskSelectIndeterminate,
                taskTableSearch, filteredTaskTables, onTaskSourceChange, onTaskTargetChange, onTaskDbChange, onTaskSelectAll, onTaskTableSelect, onRtStartupChange, onTargetWriteModeChange, applyTargetWriteMode, targetWriteModeText,
                previewTask, previewDdl, previewConfig, submitting, submitTask,
                taskList, taskSearchName, taskSearchDate, taskSearchStatus, filteredTaskList, doSearchTasks, resetTaskSearch,
                syncedTables, syncedTableKeyword, filteredSyncedTables, loadSyncedTables,
                formatNumber, taskDuration, getNextRun, handleTaskCommand,
                taskDetailVisible, taskDetail, taskDetailTables, taskDetailTab,
                ddlDialogVisible, ddlDialogContent, viewTaskDetail, viewTableDdl,
                executionList, executingTaskIds, execLogDialogVisible, viewingExec, execLogContent, viewExecutionLog, refreshExecutionLog, copyLogText,
                taskEditVisible, taskEditForm, openTaskEdit, saveTaskEdit,
                cronDialogVisible, cronTaskId, cronTaskName, cronMainTab, cronTab,
                cronExpression, cronNextRuns, cron, cronQuick, cronReadonly, weekOptions,
                applyQuickPreset, buildCron, openCronDialog, saveCron, clearCron,
                toggleTaskEnabled, toggleSchedule, executeTask, stopTask, deleteTask, loadTasks,
                logSearchKeyword, logDateRange, logSearchStatus, logList, logTotal, logPage, logPageSize, logTotalPages,
                logDetailVisible, viewingLog, logSelectedIds, isLogAllSelected,
                toggleLogSelect, toggleLogSelectAll, loadLogPage, viewLogDetail, batchDeleteLogs, resetLogSearch,
                userList, userDialogVisible, userForm, openUserDialog, saveUser, deleteUser, loadUserList,
                permUserId, permDsId, permCanSql, permList, permDsMap, loadUserPermissions, grantPermission, revokePermission,
                opLogKeyword, opLogDateRange, opLogList, opLogTotal, opLogPage, opLogPageSize, opLogTotalPages, loadOpLogPage,
                clusterList, clusterDialogVisible, clusterForm, clusterDetailVisible, clusterDetail,
                checkingAllHealth, loadClusterList, openClusterDialog, saveCluster, viewClusterDetail, checkClusterHealth, checkAllHealth, deleteCluster, getClusterName,
                alertList, alertDialogVisible, alertForm, loadAlertList, openAlertDialog, saveAlert, toggleAlert, deleteAlert, testAlert
            };
        }
    });
    app.use(ElementPlus, { locale: ElementPlusLocaleZhCn });
    app.mount('#app');
</script>
</body>
</html>
